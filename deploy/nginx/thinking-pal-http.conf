server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /bootstrap-healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 503 "Thinking Pal deployment is not active yet.\n";
    }
}
