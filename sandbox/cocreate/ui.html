<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Co-creation prompt playground</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --ink: #1d1c1a;
        --muted: #6b6a67;
        --line: #e3e1dc;
        --accent: #b4551f;
        --accent-soft: #f2e3d8;
        --field: #fbfbfa;
        --pass: #2f7d4f;
        --err: #b3261e;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1917;
          --panel: #242220;
          --ink: #ecebe8;
          --muted: #9c9a95;
          --line: #38352f;
          --accent: #e08a4f;
          --accent-soft: #3a2c20;
          --field: #1e1c1a;
          --pass: #6bbf8a;
          --err: #e77;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 14px;
        background: var(--panel);
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 650; }
      header .sub { color: var(--muted); font-size: 12px; }
      .layout {
        display: grid;
        grid-template-columns: minmax(340px, 42fr) minmax(420px, 58fr);
        gap: 0;
        height: calc(100vh - 49px);
      }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; height: auto; }
      }
      .pane { overflow-y: auto; padding: 18px 20px; }
      .pane.left { border-right: 1px solid var(--line); background: var(--panel); }
      .pane-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0 0 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .prompt {
        white-space: pre-wrap;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .prompt .search-block {
        display: block;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
        color: var(--muted);
      }
      .search-off .search-block { opacity: 0.4; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 12.5px; }
      label .hint { font-weight: 400; color: var(--muted); font-size: 11.5px; }
      input[type="text"], textarea, select {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 9px;
      }
      textarea { resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
      input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .row > * { flex: 1; }
      .check { display: flex; align-items: center; gap: 7px; flex: none; }
      .check input { width: auto; }
      .actions { position: sticky; bottom: 0; padding: 14px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--ink);
        padding: 8px 14px;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; font-size: 12px; }
      .result {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px 16px;
      }
      .result .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
      .result .diag { color: var(--muted); font-style: italic; font-size: 12.5px; margin-bottom: 8px; }
      .result ul { margin: 0; padding-left: 18px; }
      .result li { margin: 5px 0; }
      .result .pass { color: var(--pass); font-weight: 700; }
      .result .tag { display: inline-block; font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
      .result a { color: var(--accent); }
      .err { color: var(--err); }
      details { margin-top: 10px; }
      details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      details pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
      .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <h1>Co-creation prompt playground</h1>
      <span class="sub">left: live system prompt · right: your test session</span>
    </header>
    <div class="layout">
      <section class="pane left">
        <p class="pane-title">
          <span>System prompt <span id="promptModel" style="color:var(--muted);font-weight:400"></span></span>
          <button class="link" id="refreshPrompt">↻ refresh</button>
        </p>
        <div class="prompt" id="promptView">loading…</div>
        <p style="color: var(--muted); font-size: 11.5px; margin-top: 10px">
          Read-only. Ask Claude to edit the prompt, then hit refresh (or just Run — the next run re-reads it).
          The dashed block is appended only when <em>web search</em> is on.
        </p>
      </section>

      <section class="pane right">
        <p class="pane-title">Test session <span style="text-transform:none;letter-spacing:0">— editable</span></p>

        <label for="preset">Load a preset <span class="hint">(a starting point; edit freely after)</span></label>
        <select id="preset"><option value="">— blank —</option></select>

        <div class="row" style="margin-top:12px">
          <div>
            <label for="seedText">Seed / keyword <span class="hint">the note's focus</span></label>
            <input type="text" id="seedText" placeholder="voice-first capture" />
          </div>
          <div style="flex:0 0 160px">
            <label for="seedType">Seed type <span class="hint">optional</span></label>
            <input type="text" id="seedType" placeholder="decision / objection…" />
          </div>
        </div>

        <label for="contextNotes">Note bullets <span class="hint">one per line; leading spaces = sub-point</span></label>
        <textarea id="contextNotes" rows="4" placeholder="voice-first capture&#10;speaking is always faster than typing"></textarea>

        <label for="transcriptWindow">Spoken transcript window <span class="hint">verbatim, keep the fillers</span></label>
        <textarea id="transcriptWindow" rows="4" placeholder="so I keep coming back to this, like, when I talk I just get more out…"></textarea>

        <label for="signalWindow">Signals <span class="hint">one per line, e.g. [judgment] …</span></label>
        <textarea id="signalWindow" rows="3" placeholder="[judgment] speaking is always faster than typing"></textarea>

        <div class="row">
          <div>
            <label for="kept">Kept <span class="hint">liked suggestions</span></label>
            <textarea id="kept" rows="3"></textarea>
          </div>
          <div>
            <label for="rejected">Rejected <span class="hint">disliked</span></label>
            <textarea id="rejected" rows="3"></textarea>
          </div>
        </div>

        <label for="existingIdeas">Already on canvas <span class="hint">don't repeat these</span></label>
        <textarea id="existingIdeas" rows="2"></textarea>

        <div class="row" style="margin-top:14px">
          <label class="check" style="margin:0"><input type="checkbox" id="webSearch" checked /> web search enabled</label>
          <div style="flex:0 0 200px">
            <input type="text" id="model" value="gpt-5.6-terra" title="model id" />
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="run">Run ▸</button>
          <span id="status" style="color:var(--muted);font-size:12px;margin-left:10px"></span>
        </div>

        <div id="results"></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)
      const listFields = ['contextNotes', 'signalWindow', 'kept', 'rejected', 'existingIdeas']
      let CASES = []

      function splitLines(s) {
        return s.split('\n').map((l) => l.replace(/\s+$/, '')).filter((l) => l.trim().length)
      }

      function renderPrompt(base, search) {
        const on = $('webSearch').checked
        $('promptView').classList.toggle('search-off', !on)
        $('promptView').innerHTML =
          escapeHtml(base) + '<span class="search-block">' + escapeHtml(search.trim()) + '</span>'
      }
      function escapeHtml(s) {
        return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
      }

      let META = { base: '', search: '' }
      async function loadMeta() {
        $('promptView').textContent = 'loading…'
        const r = await fetch('/api/meta').then((r) => r.json())
        if (r.error) {
          $('promptView').innerHTML = '<span class="err">' + escapeHtml(r.error) + '</span>'
          return
        }
        META = r
        CASES = r.cases || []
        const sel = $('preset')
        sel.innerHTML = '<option value="">— blank —</option>'
        for (const c of CASES) {
          const o = document.createElement('option')
          o.value = c.name
          o.textContent = c.name
          sel.appendChild(o)
        }
        renderPrompt(META.base, META.search)
      }

      function loadPreset(name) {
        const c = CASES.find((x) => x.name === name)
        if (!c) return
        $('seedText').value = c.seedText || ''
        $('seedType').value = c.seedType || ''
        $('transcriptWindow').value = c.transcriptWindow || ''
        $('contextNotes').value = (c.contextNotes || []).join('\n')
        $('signalWindow').value = c.signalWindow || ''
        $('kept').value = (c.kept || []).join('\n')
        $('rejected').value = (c.rejected || []).join('\n')
        $('existingIdeas').value = (c.existingIdeas || []).join('\n')
        $('webSearch').checked = c.webSearch !== false
        renderPrompt(META.base, META.search)
      }

      function collectInput() {
        return {
          seedText: $('seedText').value.trim(),
          seedType: $('seedType').value.trim() || undefined,
          contextNotes: splitLines($('contextNotes').value),
          transcriptWindow: $('transcriptWindow').value.trim() || undefined,
          signalWindow: $('signalWindow').value.trim() || undefined,
          kept: splitLines($('kept').value),
          rejected: splitLines($('rejected').value),
          existingIdeas: splitLines($('existingIdeas').value),
          webSearch: $('webSearch').checked
        }
      }

      function renderResult(r) {
        if (r.error) return '<div class="result err">⚠️ ' + escapeHtml(r.error) + '</div>'
        const p = r.parsed
        let h = '<div class="result">'
        h += '<div class="meta"><span>' + (r.ms / 1000).toFixed(1) + 's</span>'
        h += '<span>anchor: ' + (p.anchor === null ? 'NONE' : p.anchor) + '</span></div>'
        if (p.diagnosis) h += '<div class="diag">diagnosis: ' + escapeHtml(p.diagnosis) + '</div>'
        h += '<ul>'
        if (p.passed) h += '<li class="pass">PASS — no contribution</li>'
        for (const b of p.bullets) h += '<li>' + escapeHtml(b.replace(/^-\s*/, '')) + '</li>'
        if (p.search) h += '<li><span class="tag">search' + (p.search.image ? ' image' : '') + '</span>' + escapeHtml(p.search.query) + '</li>'
        for (const u of p.urls) h += '<li><span class="tag">link</span><a href="' + u.url + '" target="_blank" rel="noopener">' + escapeHtml(u.title) + '</a></li>'
        h += '</ul>'
        h += '<details><summary>raw model reply</summary><pre>' + escapeHtml(r.raw || '(empty)') + '</pre></details>'
        h += '<details><summary>exact user message sent</summary><pre>' + escapeHtml(r.userText || '') + '</pre></details>'
        h += '</div>'
        return h
      }

      async function run() {
        const input = collectInput()
        if (!input.seedText) {
          $('status').innerHTML = '<span class="err">seed / keyword is required</span>'
          return
        }
        $('run').disabled = true
        $('status').innerHTML = '<span class="spinner"></span> running codex…'
        const t0 = Date.now()
        const tick = setInterval(() => {
          $('status').innerHTML = '<span class="spinner"></span> running codex… ' + ((Date.now() - t0) / 1000).toFixed(0) + 's'
        }, 1000)
        try {
          const r = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ input, model: $('model').value.trim() })
          }).then((r) => r.json())
          $('results').innerHTML = renderResult(r) + $('results').innerHTML
          $('status').textContent = ''
        } catch (e) {
          $('status').innerHTML = '<span class="err">' + escapeHtml(String(e)) + '</span>'
        } finally {
          clearInterval(tick)
          $('run').disabled = false
        }
      }

      $('preset').addEventListener('change', (e) => loadPreset(e.target.value))
      $('refreshPrompt').addEventListener('click', loadMeta)
      $('webSearch').addEventListener('change', () => renderPrompt(META.base, META.search))
      $('run').addEventListener('click', run)
      loadMeta()
    </script>
  </body>
</html>
